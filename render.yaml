services:
  - type: web
    name: decentracert
    env: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PINATA_JWT
        sync: false
      - key: UPLOAD_KEY
        sync: false
      - key: SEPOLIA_API_URL
        sync: false
